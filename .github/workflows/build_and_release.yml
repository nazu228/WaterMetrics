name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller WaterMetrics.spec

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/setup_script.iss

      - name: Build Lightweight Patch Zip
        run: |
          python -c "
          import os, zipfile
          from config import APP_VERSION
          os.makedirs('dist', exist_ok=True)
          patch_zip = f'dist/WaterMetrics_v{APP_VERSION}_patch.zip'
          allowed_dirs = {'core', 'services', 'ui', 'assets'}
          allowed_root = {'main.py', 'config.py', 'models.py', 'CHANGELOG.md', 'requirements.txt'}
          exclude_ext = {'.pyc', '.pyo', '.pyd', '.spec', '.log', '.tmp', '.exe', '.xlsx', '.zip', '.bak'}
          with zipfile.ZipFile(patch_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for root, dirs, files in os.walk('.'):
                  dirs[:] = [d for d in dirs if d not in ('.git', '__pycache__', 'build', 'dist', 'dist_installer', 'dist_release', '.venv', 'venv') and not d.startswith('.')]
                  rel_root = os.path.relpath(root, '.')
                  top_dir = rel_root.split(os.sep)[0] if rel_root != '.' else '.'
                  if top_dir != '.' and top_dir not in allowed_dirs:
                      continue
                  for f in files:
                      if os.path.splitext(f)[1].lower() in exclude_ext or f.startswith('.'):
                          continue
                      if top_dir == '.' and f not in allowed_root:
                          continue
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, '.'))
          print('Created patch:', patch_zip, 'Size:', os.path.getsize(patch_zip))
          "

      - name: Publish GitHub Release and Assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Publishing release for tag: $tag"
          $files = Get-ChildItem -Path "dist", "dist_installer" -Include "WaterMetrics.exe", "WaterMetrics_Setup_*.exe", "WaterMetrics_v*_patch.zip" -Recurse | Select-Object -ExpandProperty FullName
          Write-Host "Found asset files: $files"
          
          # Проверяем существует ли уже релиз
          gh release view $tag
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $tag already exists. Uploading/clobbering assets..."
              foreach ($file in $files) {
                  gh release upload $tag $file --clobber
              }
          } else {
              Write-Host "Creating new release $tag..."
              gh release create $tag $files --title "WaterMetrics $tag" --notes-file CHANGELOG.md
          }
