name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller WaterMetrics.spec

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/setup_script.iss

      - name: Build Lightweight Patch Zip
        run: |
          python -c "
          import os, zipfile
          from config import APP_VERSION
          os.makedirs('dist', exist_ok=True)
          patch_zip = f'dist/WaterMetrics_v{APP_VERSION}_patch.zip'
          ignored = {'__pycache__', '.git', 'build', 'dist', '.vscode', '.idea', '.gemini', 'env', 'venv', '.venv'}
          with zipfile.ZipFile(patch_zip, 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('.'):
                  dirs[:] = [d for d in dirs if d not in ignored and not d.startswith('.')]
                  for f in files:
                      if not f.endswith(('.pyc', '.pyo', '.tmp', '.bak')) and f not in {'Thumbs.db', 'Desktop.ini'}:
                          p = os.path.join(root, f)
                          z.write(p, os.path.relpath(p, '.'))
          print('Created patch:', patch_zip)
          "

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/WaterMetrics.exe
            dist/WaterMetrics_Setup_*.exe
            dist/WaterMetrics_v*_patch.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
