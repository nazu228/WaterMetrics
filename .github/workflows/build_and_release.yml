name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller WaterMetrics.spec

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/setup_script.iss

      - name: Build Lightweight Patch Zip
        run: |
          python -c "
          import os, zipfile
          from config import APP_VERSION
          os.makedirs('dist', exist_ok=True)
          patch_zip = f'dist/WaterMetrics_v{APP_VERSION}_patch.zip'
          ignored = {'__pycache__', '.git', 'build', 'dist', '.vscode', '.idea', '.gemini', 'env', 'venv', '.venv'}
          with zipfile.ZipFile(patch_zip, 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('.'):
                  dirs[:] = [d for d in dirs if d not in ignored and not d.startswith('.')]
                  for f in files:
                      if not f.endswith(('.pyc', '.pyo', '.tmp', '.bak')) and f not in {'Thumbs.db', 'Desktop.ini'}:
                          p = os.path.join(root, f)
                          z.write(p, os.path.relpath(p, '.'))
          print('Created patch:', patch_zip)
          "

      - name: Publish GitHub Release and Assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Publishing release for tag: $tag"
          $files = Get-ChildItem -Path "dist" -Include "WaterMetrics.exe", "WaterMetrics_Setup_*.exe", "WaterMetrics_v*_patch.zip" -Recurse | Select-Object -ExpandProperty FullName
          
          # Проверяем существует ли уже релиз
          gh release view $tag
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $tag already exists. Uploading/clobbering assets..."
              foreach ($file in $files) {
                  gh release upload $tag $file --clobber
              }
          } else {
              Write-Host "Creating new release $tag..."
              gh release create $tag $files --title "WaterMetrics $tag" --notes-file CHANGELOG.md
          }
